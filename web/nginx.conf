server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: any path that isn't a real static file falls back to index.html
    # so client-side view state (this app doesn't use URL routing yet — see
    # docs/STATUS.md) still loads correctly on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
