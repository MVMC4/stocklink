[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/identity",
    "crates/commerce",
    "crates/notifications",
    "crates/media",
]

# Every service and the shared crate pin the same dependency versions here so
# a workspace-wide `cargo build`/`cargo update` never lets two services drift
# onto incompatible versions of something they both link (e.g. two `axum`
# minor versions would make `shared`'s `AppStateAuth` trait impl invisible to
# one of them).
[workspace.dependencies]
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = [
    "trace",
    "cors",
    "compression-gzip",
    "decompression-gzip",
    "request-id",
    "timeout",
    "limit",
    "catch-panic",
    "sensitive-headers",
] }
tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "rust_decimal",
    "migrate",
] }
deadpool-redis = { version = "0.15", features = ["rt_tokio_1"] }
redis = { version = "0.25", features = ["tokio-comp"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

jsonwebtoken = "9"
argon2 = "0.5"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"

uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde-float"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
validator = { version = "0.18", features = ["derive"] }
time = "0.3"

thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
async-trait = "0.1"
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid", "decimal_float", "preserve_order"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum", "vendored"] }

opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "grpc-tonic",
    "tls-ring",
    "tls-webpki-roots",
] }
tracing-opentelemetry = "0.33"

moka = { version = "0.12", features = ["sync"] }
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
