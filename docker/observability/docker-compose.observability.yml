name: stocklink-observability

# ─────────────────────────────────────────────────────────────────────────────
# StockLink — production API & health monitoring stack.
#
#   prometheus  scrapes the API's GET /metrics (HTTP counters + the
#               stocklink_up / stocklink_dependency_up / stocklink_build_info
#               gauges the metrics handler appends per scrape).
#   grafana     provisioned with the Prometheus datasource and the
#               "StockLink — API & Health" dashboard (no manual setup).
#
# Point it at the API with STOCKLINK_API_TARGET:
#   - standalone, API on the host:     host.docker.internal:8080  (default)
#   - joined to a compose network:     api:8080
#
# Usage:
#   docker compose -f docker/observability/docker-compose.observability.yml up -d
#   open http://localhost:3019   (admin / admin — change GF_SECURITY_ADMIN_PASSWORD)
#
# In production run this alongside docker-compose.prod.yml (or merge the two
# service sets) and lock Grafana down: real admin password, TLS at the proxy,
# and keep /metrics unreachable from the public internet.
# ─────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: stocklink-prometheus
    restart: unless-stopped
    # The committed prometheus.yml has a `__API_TARGET__` placeholder; substitute
    # it at start so the scrape target is configurable without editing the file.
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s#__API_TARGET__#$${STOCKLINK_API_TARGET:-host.docker.internal:8080}#g" \
          /etc/prometheus/prometheus.yml > /prometheus/prometheus.runtime.yml
        exec /bin/prometheus \
          --config.file=/prometheus/prometheus.runtime.yml \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      STOCKLINK_API_TARGET: ${STOCKLINK_API_TARGET:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9095:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.1
    container_name: stocklink-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GF_PORT:-3019}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
