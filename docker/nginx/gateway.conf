# StockLink gateway — demo, staging and production. The one browser-facing
# entry point for those environments, routing to four independent services
# by path prefix (see gateway.dev.conf's header comment for the full map —
# identical here except there is no /docs route in these environments).
#
# /metrics and /internal/* are intentionally never reachable through this
# gateway — Prometheus scrapes each service directly on the internal `app`
# network, and `/internal/*` is service-to-service only, guarded again by
# the shared X-Internal-Token (stocklink_shared::middleware).
#
# Proxy headers (each service trusts them only when TRUST_PROXY_HEADERS=true):
#   X-Forwarded-For / X-Real-IP are OVERWRITTEN with the peer address, never
#   appended to a client-supplied value. The rate limiter keys on the first
#   X-Forwarded-For entry, so appending would let a client choose its own
#   rate-limit bucket. Behind a load balancer, configure nginx
#   `set_real_ip_from` for the balancer's addresses so $remote_addr is the
#   real client; without it, all clients share the balancer's bucket
#   (coarser, never spoofable).
#   X-Forwarded-Proto passes through the value set by an upstream TLS
#   terminator, falling back to this hop's scheme. Each service's
#   ENFORCE_HTTPS check relies on it; production must place this gateway
#   behind TLS and never publish its port directly to the internet.
resolver 127.0.0.11 valid=5s;

map $http_x_forwarded_proto $sl_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Plain liveness probe for the gateway container itself; does not touch
    # any upstream, so it stays green even if a service is briefly down.
    location = /gw-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api/)?(metrics|internal)(/|$) {
        return 404;
    }

    # Documentation is served only by the dev environment's gateway.
    location /docs {
        default_type text/plain;
        return 404 "Documentation is served only in the dev environment.\n";
    }

    location ~ ^/api/v1/(auth|onboarding|admin)/ {
        set $upstream http://identity:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/(warehouses|catalog|cart|orders)(/|$) {
        set $upstream http://commerce:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/(notifications|devices)(/|$) {
        set $upstream http://notifications:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/media/ {
        client_max_body_size 1m;
        set $upstream http://media:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
    }
}
