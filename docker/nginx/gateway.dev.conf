# StockLink gateway — dev environment only. Routes to four independent
# services by path prefix, plus web/docs. Identical proxy-header rules to
# gateway.conf.
#
#   /                          -> web
#   /api/v1/auth/*             -> identity
#   /api/v1/onboarding/*       -> identity
#   /api/v1/admin/*            -> identity
#   /api/v1/warehouses/*       -> commerce (catalogue + order status live under here too)
#   /api/v1/catalog*           -> commerce
#   /api/v1/cart/*             -> commerce
#   /api/v1/orders*            -> commerce
#   /api/v1/notifications*     -> notifications
#   /api/v1/devices            -> notifications
#   /api/v1/media/*            -> media
#   /api/search                -> docs (Fumadocs search client)
#   /docs, /_next/             -> docs
#
# `/internal/*` and `/metrics` are never reachable through this gateway at
# any path — each service's `/internal/*` API is service-to-service only
# (reachable directly on the `app` Docker network, guarded again by the
# shared X-Internal-Token; see stocklink_shared::middleware) and `/metrics`
# is scraped by Prometheus directly against each service's container.
#
# Uses Docker's embedded DNS (127.0.0.11) with a short TTL and a variable in
# every proxy_pass, instead of a static upstream, so a service can be scaled
# up/down (see scripts/rolling-update.mjs) without an nginx reload — a new
# container's IP is picked up within the TTL below, not only at startup.
resolver 127.0.0.11 valid=5s;

map $http_x_forwarded_proto $sl_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    location = /gw-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api/)?(metrics|internal)(/|$) {
        return 404;
    }

    location = /api/search {
        proxy_pass http://docs:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
    }

    location /_next/ {
        proxy_pass http://docs:3010/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://docs:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
    }

    location ~ ^/api/v1/(auth|onboarding|admin)/ {
        set $upstream http://identity:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/(warehouses|catalog|cart|orders)(/|$) {
        set $upstream http://commerce:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/(notifications|devices)(/|$) {
        set $upstream http://notifications:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/media/local/ {
        # The `local` dev backend has no real presigning concept (see
        # media::presign_upload), so unlike the general media location
        # below, actual image bytes really do flow through this route —
        # matches PUBLIC_MEDIA_MAX_UPLOAD_BYTES's default (10 MiB) plus
        # headroom for multipart/JSON framing.
        client_max_body_size 12m;
        set $upstream http://media:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/media/ {
        # Presigned uploads go straight to S3 from the browser; this route
        # only carries the small presign request/response, not the media
        # bytes themselves.
        client_max_body_size 1m;
        set $upstream http://media:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $sl_forwarded_proto;
    }
}
